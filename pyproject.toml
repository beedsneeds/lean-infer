[project]
name = "lean-infer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.23.0",
    "numpy>=2.1",
    "safetensors>=0.8.0",
    "torch==2.9.1",
    "transformers>=5.13.1",
    "prometheus-client>=0.21",
]

[project.scripts]
leaninfer = "leaninfer.main:main"


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[tool.pyright]
include = ["leaninfer"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingParameterType = "error"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.setuptools]
packages = ["leaninfer"]
