[project]
name = "lean-infer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.23.0",
    "numpy>=2.1",
    "safetensors>=0.8.0",
    "torch==2.9.1",
    "transformers>=5.13.1",
    "prometheus-client>=0.21",
    "flash-attn"
]

[project.scripts]
leaninfer = "leaninfer.main:main"


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.11/flash_attn-2.8.3+cu129torch2.9-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl" }

[tool.pyright]
include = ["leaninfer"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingParameterType = "error"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.setuptools]
packages = ["leaninfer"]
