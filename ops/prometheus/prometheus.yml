global:
  # see if this is a good interval
  scrape_interval: 1s
  evaluation_interval: 15s

scrape_configs:
  # "engine" is an alias defined by extra_hosts in docker-compose.yml
  # since it has to resolve differently on WSL2 than on native Linux
  - job_name: leaninfer
    static_configs:
      - targets: ["engine:8000"]

  # L4 only: bring up the gpu profile, then uncomment
  - job_name: dcgm
    scrape_interval: 1s
    static_configs:
      - targets: ["dcgm-exporter:9400"]
